name: Update publications

on:
  schedule:
    - cron: "17 5 * * 1" # Mondays, 05:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh the list from Google Scholar
        run: |
          if grep -q '^SCHOLAR_USER = ""' scripts/update_publications.py; then
            echo "SCHOLAR_USER not set yet; skipping."; exit 0
          fi
          python3 scripts/update_publications.py
      - name: Commit if the list changed
        run: |
          git diff --quiet publications.html && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update publication list from Google Scholar" publications.html
          git push
