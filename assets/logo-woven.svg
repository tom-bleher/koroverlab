<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Korover Lab: a nucleus at the centre of a woven basket, seen from above">
  <g transform="translate(60 60)">
    <!-- weavers -->
    <g fill="none" stroke="#DDA85E" stroke-width="6.4">
      <circle r="28"/><circle r="36"/><circle r="44"/><circle r="52"/>
    </g>
    <!-- spokes, passing over every other weaver -->
    <g stroke="#9A5F1C" stroke-width="3.6" stroke-dasharray="8 8">
      <g id="spokes">
        <path d="M24 0H56"/>
        <path d="M24 0H56" stroke-dashoffset="8" transform="rotate(22.5)"/>
      </g>
      <use href="#spokes" transform="rotate(45)"/>
      <use href="#spokes" transform="rotate(90)"/>
      <use href="#spokes" transform="rotate(135)"/>
      <use href="#spokes" transform="rotate(180)"/>
      <use href="#spokes" transform="rotate(225)"/>
      <use href="#spokes" transform="rotate(270)"/>
      <use href="#spokes" transform="rotate(315)"/>
    </g>
    <circle r="56.8" fill="none" stroke="#B97A2E" stroke-width="3.6"/>
    <!-- nucleus -->
    <g stroke-width=".8">
      <g fill="#3B6EA5" stroke="#2B5484"><circle cx="-6.3" cy="-10.9" r="7.4"/><circle cx="12.6" r="7.4"/><circle cx="-6.3" cy="10.9" r="7.4"/></g>
      <g fill="#C8503C" stroke="#A53C2B"><circle cx="6.3" cy="-10.9" r="7.4"/><circle cx="-12.6" r="7.4"/><circle cx="6.3" cy="10.9" r="7.4"/></g>
      <circle r="7.4" fill="#3B6EA5" stroke="#2B5484"/>
    </g>
    <g fill="#fff" opacity=".38">
      <circle cx="-8.8" cy="-13.7" r="2.1"/><circle cx="10.1" cy="-2.8" r="2.1"/><circle cx="-8.8" cy="8.1" r="2.1"/>
      <circle cx="3.8" cy="-13.7" r="2.1"/><circle cx="-15.1" cy="-2.8" r="2.1"/><circle cx="3.8" cy="8.1" r="2.1"/><circle cx="-2.5" cy="-2.8" r="2.1"/>
    </g>
  </g>
</svg>
